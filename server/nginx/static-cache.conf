# Include this file inside the HTTPS server block for vikingagm.com.
# HTML is intentionally excluded so new pages and metadata remain fresh.
location ^~ /_next/static/ {
    include /etc/nginx/snippets/viking-agm-security-headers.conf;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    include /etc/nginx/snippets/viking-agm-security-headers.conf;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location ~* \.(?:mp4|webm)$ {
    include /etc/nginx/snippets/viking-agm-security-headers.conf;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

location ~* \.pdf$ {
    include /etc/nginx/snippets/viking-agm-security-headers.conf;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}
