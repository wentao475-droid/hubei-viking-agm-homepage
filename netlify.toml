[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/baidu_verify_codeva-KKQCucIOJa.html"
  to = "/baidu_verify_codeva-KKQCucIOJa.html"
  status = 200
  force = true

[[redirects]]
  from = "https://vikingagm.com/*"
  to = "https://www.vikingagm.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
